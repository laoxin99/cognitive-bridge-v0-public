<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CognitiveBridge-v0 机制流程图</title>
  <desc id="desc">固定离线演示中的候选路径 B 经反馈改道为 C，并完成再次验收与回放校验。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#18324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b67a5"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #132238; }
      .subtitle { font: 400 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #46627e; }
      .box-title { font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #132238; }
      .box-text { font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #36516d; }
      .box-code { font: 600 15px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #1f5d96; }
      .note { font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b6178; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="20" fill="url(#bg)"/>
  <text x="56" y="58" class="title">CognitiveBridge-v0 / 机制流程</text>
  <text x="56" y="88" class="subtitle">固定离线 fixture：反馈暴露证据缺口后，路径在既定边界内改道并回放校验</text>

  <g filter="url(#shadow)">
    <rect x="56" y="140" width="175" height="135" rx="14" fill="#ffffff" stroke="#a7c2df" stroke-width="2"/>
    <rect x="265" y="140" width="190" height="135" rx="14" fill="#ffffff" stroke="#a7c2df" stroke-width="2"/>
    <rect x="489" y="140" width="175" height="135" rx="14" fill="#fffaf0" stroke="#e2bd70" stroke-width="2"/>
    <rect x="698" y="140" width="175" height="135" rx="14" fill="#ffffff" stroke="#a7c2df" stroke-width="2"/>
    <rect x="907" y="140" width="185" height="135" rx="14" fill="#f3fbf6" stroke="#91c5a3" stroke-width="2"/>
  </g>

  <line x1="231" y1="207" x2="257" y2="207" stroke="#2b67a5" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="455" y1="207" x2="481" y2="207" stroke="#2b67a5" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="664" y1="207" x2="690" y2="207" stroke="#2b67a5" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="873" y1="207" x2="899" y2="207" stroke="#2b67a5" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="78" y="178" class="box-title">候选路径</text>
  <text x="78" y="207" class="box-text">Candidate path</text>
  <text x="78" y="242" class="box-code">B selected</text>

  <text x="287" y="178" class="box-title">反馈</text>
  <text x="287" y="207" class="box-text">Evidence gap found</text>
  <text x="287" y="242" class="box-code">workflow_action_</text>
  <text x="287" y="263" class="box-code">mapping_missing</text>

  <text x="511" y="178" class="box-title">偏离标记</text>
  <text x="511" y="207" class="box-text">Original path</text>
  <text x="511" y="242" class="box-code">B = deviated</text>

  <text x="720" y="178" class="box-title">重新选择</text>
  <text x="720" y="207" class="box-text">Within fixed boundary</text>
  <text x="720" y="242" class="box-code">C selected</text>

  <text x="929" y="178" class="box-title">再次验收</text>
  <text x="929" y="207" class="box-text">Validation + replay</text>
  <text x="929" y="242" class="box-code">passed</text>
  <text x="929" y="263" class="box-code">replay_verified = True</text>

  <path d="M1088 325 C1088 375 1120 392 1120 392 L80 392" fill="none" stroke="#78a2c9" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="56" y="430" class="note">This diagram explains only the published, fixed offline fixture.</text>
  <text x="56" y="457" class="note">本图仅用于解释已公开的固定离线演示，不代表真实高权限执行环境或 AGI。</text>
</svg>

